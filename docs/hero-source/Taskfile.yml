# docs/hero-source/Taskfile.yml
#
# Production pipeline for the README hero motion piece. Two-stage build:
#
#   1. VHS tape (vhs/hero-clip.tape) → docs/assets/hero-clip.{gif,mp4}
#      The MP4 is what scene 4 of the hyperframes composition embeds as
#      a timeline-scrubbable <video>.
#   2. hyperframes composition (hyperframes/index.html) → docs/assets/hero.mp4
#      The GIF fallback (docs/assets/hero.gif) is an ffmpeg-derived
#      palette+dither pass over the MP4.
#
# Required tools: bun, charm.sh/vhs, ffmpeg, and the `akua` binary
# itself (the VHS tape records a real session against examples/01-hello-webapp).
#
# Run the whole pipeline:    task all
# List every step:           task --list

version: '3'

vars:
  REPO_ROOT:
    sh: git -C {{.TASKFILE_DIR}} rev-parse --show-toplevel
  ASSETS: '{{.REPO_ROOT}}/docs/assets'
  HERO_SOURCE: '{{.TASKFILE_DIR}}'
  HF_DIR: '{{.TASKFILE_DIR}}/hyperframes'
  VHS_DIR: '{{.TASKFILE_DIR}}/vhs'

tasks:
  default:
    desc: List the pipeline steps
    cmds:
      - task --list

  install:
    desc: Install hyperframes locally (one-time)
    dir: '{{.HF_DIR}}'
    cmds:
      - bun install
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/.package-lock.json

  tape:
    desc: Re-record the terminal session → hero-clip.gif
    dir: '{{.VHS_DIR}}'
    cmds:
      - vhs hero-clip.tape
      - cp hero-clip.gif {{.ASSETS}}/hero-clip.gif
    sources:
      - hero-clip.tape
    generates:
      - hero-clip.gif

  clip-mp4:
    desc: Convert the VHS GIF → MP4 (scene 4 embeds the MP4, not the GIF)
    deps: [tape]
    dir: '{{.ASSETS}}'
    cmds:
      - >-
        ffmpeg -y -i hero-clip.gif
        -c:v libx264 -movflags +faststart -pix_fmt yuv420p
        -vf "fps=20,scale=trunc(iw/2)*2:trunc(ih/2)*2"
        -loglevel error hero-clip.mp4
      - cp hero-clip.mp4 {{.HF_DIR}}/assets/hero-clip.mp4
    sources:
      - hero-clip.gif
    generates:
      - hero-clip.mp4

  lint:
    desc: Lint the hyperframes composition
    deps: [install]
    dir: '{{.HF_DIR}}'
    cmds:
      - bun run lint

  render:
    desc: Render hyperframes → hero.mp4
    deps: [install, clip-mp4]
    dir: '{{.HF_DIR}}'
    cmds:
      - bun run render -- -o {{.ASSETS}}/hero.mp4 --quality high
    sources:
      - index.html
      - assets/hero-clip.mp4
    generates:
      - '{{.ASSETS}}/hero.mp4'

  gif:
    desc: Derive the GIF fallback from hero.mp4 (palette + bayer dither)
    deps: [render]
    dir: '{{.ASSETS}}'
    cmds:
      - >-
        ffmpeg -y -i hero.mp4
        -vf "fps=12,scale=960:-1:flags=lanczos,palettegen=stats_mode=full:max_colors=128"
        -loglevel error palette.png
      - >-
        ffmpeg -y -i hero.mp4 -i palette.png
        -lavfi "fps=12,scale=960:-1:flags=lanczos [x]; [x][1:v] paletteuse=dither=bayer:bayer_scale=5"
        -loglevel error hero.gif
      - rm -f palette.png
    sources:
      - hero.mp4
    generates:
      - hero.gif

  preview:
    desc: Live-reload preview in the browser
    deps: [install, clip-mp4]
    dir: '{{.HF_DIR}}'
    cmds:
      - bun run dev

  all:
    desc: Full pipeline — tape → clip-mp4 → render → gif
    cmds:
      - task: gif

  clean:
    desc: Remove rendered artifacts in docs/assets/ (keeps sources)
    dir: '{{.ASSETS}}'
    cmds:
      - rm -f hero.mp4 hero.gif hero-clip.mp4 hero-clip.gif palette.png

name: sdk-release

# Publish `@akua-dev/sdk` to npm on a `v<semver>` tag push. The same
# tag triggers native-release.yml in parallel; the wait step below
# polls npm for the matching `@akua-dev/native@<same-version>` (up to
# 45 min) before publishing the SDK. One tag, two workflows, the SDK
# blocks until native lands.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Skip the actual publish (build + npm pack --dry-run only)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: actions/setup-node@v4
        # Node 24 for npm 11+ (OIDC trusted-publishing support);
        # see native-release.yml for the full rationale.
        with:
          node-version: '24'

      # The Rust generator writes into packages/sdk/src/{types,schemas}.
      # Regenerate on the runner so we publish from the same bytes main
      # CI just verified — a tag pushed from a stale checkout must not
      # silently publish stale types.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-release
          cache-on-failure: true

      - name: Regenerate SDK types + schema bundle
        run: mise exec -- task sdk:gen

      - name: Drift guard (fail if Rust source and bindings diverge)
        run: mise exec -- task sdk:check

      - name: Bump package.json version from the tag
        # Tag format: `v1.2.3` → npm version `1.2.3`. Rewrite both
        # `version` and the pinned `@akua-dev/native` dep so the SDK
        # pulls the matching native published by native-release.yml.
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          echo "Publishing @akua-dev/sdk@${version}"
          jq --arg v "$version" \
            '.version = $v | .dependencies["@akua-dev/native"] = $v' \
            packages/sdk/package.json > packages/sdk/package.json.tmp
          mv packages/sdk/package.json.tmp packages/sdk/package.json

      - name: Wait for matching @akua-dev/native on npm
        # native-release.yml runs in parallel from the same `v<x.y.z>`
        # tag. Its full chain (Windows build + cross-compile builds +
        # 9 sequential npm publishes) takes ~35 min cold; sdk-release
        # is much faster and would otherwise try to pin a version of
        # `@akua-dev/native` that isn't on npm yet. Poll for up to 45
        # min (incident-derived budget — v0.8.5's first sdk-release
        # run timed out at the old 20-min while native finished 7 min
        # later). Fast path on a sequenced release is one npm view
        # call (~1 s).
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          deadline=$((SECONDS + 2700))
          while ! npm view "@akua-dev/native@${version}" version > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "ERROR: @akua-dev/native@${version} did not appear on npm within 45 min."
              echo "native-release.yml likely failed; rerun it (workflow_dispatch) before retrying this job."
              exit 1
            fi
            echo "@akua-dev/native@${version} not on npm yet — retry in 30 s..."
            sleep 30
          done
          echo "@akua-dev/native@${version} is on npm — proceeding with sdk publish."

      - name: Build SDK (bun bundle + tsc declarations)
        run: mise exec -- task sdk:build

      - name: Pack dry-run (manifest sanity)
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Publish to npm
        # Auth via npm trusted publishing (OIDC). No NPM_TOKEN needed —
        # each package on npmjs.com has GitHub Actions configured as a
        # trusted publisher pointing at this repo + workflow.
        if: github.event_name == 'push' || inputs.dry-run == false
        working-directory: packages/sdk
        run: npm publish --access public --provenance

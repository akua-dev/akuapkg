name: release

# Build half of the release pipeline. Triggered by `v<semver>` tag pushes.
# Builds binaries, creates the GitHub Release, then dispatches
# `release-publish.yml` for the npm publish step.
#
# Job graph:
#
#   detect-version ─┬─> wasm-bundle ─┬─> native-build ──┐
#                   │                │                  │
#                   │                │  sdk-build ──────┤
#                   │                │                  │
#                   │                └─> cli-build ─┬─> github-release ┬─> trigger-publish ──> release-publish.yml
#                   │                               └─> docker         │
#                   └─ (version + is_prerelease propagated to every job)
#
# Why split publish into a separate workflow: `npm publish` is the
# most failure-prone step (OIDC config drift, registry hiccups,
# version-pin mismatch). When it fails today, fixing it required
# re-running the whole build matrix (~hours). With the split:
#
#   See docs/releasing.md for the SHA-bound recovery dispatch.
#
# re-runs publish without repeating successful npm versions. The build outputs
# remain Actions artifacts for the source run; a recovery preserves existing
# GitHub Release assets byte-for-byte and publishes only from the exact verified
# source-run artifacts.
#
# `trigger-publish` calls `gh workflow run release-publish.yml` —
# `workflow_dispatch` is explicitly carved out of the GITHUB_TOKEN
# no-recursion rule (per Actions docs), so the default token works
# without a PAT.
#
# Other wins preserved from the prior unified-workflow setup:
# - `wasm-bundle` builds once (was rebuilt in cli + native + sdk
#   matrices — ~5–10 min saved per release).
# - One status check on the build half; one on the publish half.
#
# Prerelease handling: tags containing `-` (e.g. `v0.8.7-rc1`) publish
# to the npm `next` dist-tag instead of `latest`, are marked as
# prereleases on GitHub Releases, and skip the `:latest` Docker tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Skip every actual publish; build + pack only'
        type: boolean
        default: true
      tag:
        description: 'Tag name (e.g. v0.8.7) — required for manual runs'
        required: true
      expected-source-commit:
        description: 'Reviewed commit the tag must resolve to — required for manual runs'
        required: true
        type: string
      expected-workflow-commit:
        description: 'Reviewed commit containing this workflow — required for manual runs'
        required: true
        type: string

permissions:
  contents: write   # github-release: create Releases
  packages: write   # docker: push to ghcr.io
  id-token: write   # npm publish: OIDC trusted publishing
  actions: write    # trigger-publish: gh workflow run release-publish.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # detect-version — single source of truth for tag-derived strings.
  # Other jobs reference these outputs instead of re-parsing GITHUB_REF_NAME,
  # which avoids tag-prefix drift and keeps prerelease detection in one
  # place (the only spot a typo here would surface).
  # ---------------------------------------------------------------------------
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.parse.outputs.npm_dist_tag }}
      source_commit: ${{ steps.parse.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected-source-commit }}
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected-workflow-commit }}
          ACTUAL_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not a valid semver v* tag"
            exit 1
          fi
          source_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::expected source commit is not a full lowercase SHA"
              exit 1
            fi
            if [[ ! "$EXPECTED_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::expected workflow commit is not a full lowercase SHA"
              exit 1
            fi
            if [[ "$source_commit" != "$EXPECTED_SOURCE_COMMIT" ]]; then
              echo "::error::$tag resolves to $source_commit, expected $EXPECTED_SOURCE_COMMIT"
              exit 1
            fi
            if [[ "$ACTUAL_WORKFLOW_COMMIT" != "$EXPECTED_WORKFLOW_COMMIT" ]]; then
              echo "::error::workflow commit $ACTUAL_WORKFLOW_COMMIT does not match expected $EXPECTED_WORKFLOW_COMMIT"
              exit 1
            fi
          fi
          head_commit=$(git rev-parse 'HEAD^{commit}')
          if [[ "$head_commit" != "$source_commit" ]]; then
            echo "::error::checkout $head_commit does not match $tag at $source_commit"
            exit 1
          fi
          version="${tag#v}"
          # Semver prerelease has a `-` separator after the patch number
          # (1.2.3-rc1, 1.2.3-alpha.4). A bare `v1.2.3` doesn't match.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            npm_dist_tag=next
          else
            is_prerelease=false
            npm_dist_tag=latest
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "npm_dist_tag=$npm_dist_tag"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag commit=$source_commit version=$version prerelease=$is_prerelease npm_dist_tag=$npm_dist_tag"

      - name: Record immutable recovery inputs
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.parse.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          jq -n \
            --arg tag "$TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg workflow_commit "$WORKFLOW_COMMIT" \
            '{tag: $tag, source_commit: $source_commit, workflow_commit: $workflow_commit}' \
            > release-inputs.json

      - name: Upload immutable recovery inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: release-inputs.json
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # wasm-bundle — engine + render-worker wasm artefacts built once on
  # Linux. wasm32-wasip1 is byte-deterministic across runners, so the
  # native + cli matrix jobs each download the same bytes instead of
  # rebuilding them — saves ~5-10 min per matrix runner and unblocks
  # the Windows runner (the helm fork's apply.sh is bash, can't run on
  # Windows natively).
  # ---------------------------------------------------------------------------
  wasm-bundle:
    runs-on: ubuntu-latest
    needs: detect-version
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: rui314/setup-mold@v1

      - name: Install wasm32-wasip1 target
        run: mise exec -- rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-bundle
          cache-on-failure: true

      # Mirror the cache shape ci.yml uses — same content-addressed
      # keys mean this job inherits hits from main-branch CI runs and
      # skips redundant Go compiles.
      - name: Restore helm engine wasm cache
        uses: actions/cache@v5
        with:
          path: crates/helm-engine-wasm/assets/helm-engine.wasm
          key: helm-engine-${{ runner.os }}-${{ hashFiles('.mise.toml', 'crates/helm-engine-wasm/go-src/**', 'crates/helm-engine-wasm/fork/**') }}

      - name: Restore kustomize engine wasm cache
        uses: actions/cache@v5
        with:
          path: crates/kustomize-engine-wasm/assets/kustomize-engine.wasm
          key: kustomize-engine-${{ runner.os }}-${{ hashFiles('.mise.toml', 'crates/kustomize-engine-wasm/go-src/**') }}

      - name: Cache Go module + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('.mise.toml', '**/go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache helm fork tree
        uses: actions/cache@v5
        with:
          path: crates/helm-engine-wasm/third_party/helm-fork
          key: helm-fork-${{ runner.os }}-${{ hashFiles('crates/helm-engine-wasm/fork/**') }}

      - name: Build embedded engines (Go → wasip1)
        run: mise exec -- task build:engines

      - name: Build embedded render-worker (Rust → wasip1)
        run: mise exec -- task build:render-worker

      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: |
            crates/helm-engine-wasm/assets/helm-engine.wasm
            crates/kustomize-engine-wasm/assets/kustomize-engine.wasm
            target/wasm32-wasip1/release/akua-render-worker.wasm
            target/wasm32-wasip1/release/akua-render-worker.wasm.sources.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # native-build — per-platform `.node` binary matrix. Downloads the
  # wasm bundle, runs `napi build` against the local toolchain.
  # ---------------------------------------------------------------------------
  native-build:
    needs: [detect-version, wasm-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          # macos-13 (Intel) runners are being deprecated and queue for
          # 40min+. Cross-compile x86_64 from macos-14 (arm64) — rustc
          # + Apple SDK handle this without extra setup.
          - host: macos-14
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pin to the same rust version mise installs (`.mise.toml`) so the
      # cross-compile target lands on the toolchain mise will later
      # activate. With `@stable`, mise's rust 1.95.0 became the active
      # toolchain after this step ran and cargo couldn't find the target.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.target }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Install napi deps
        working-directory: crates/akua-napi
        run: bun install --frozen-lockfile

      - name: Bump package.json version from the tag
        shell: bash
        run: |
          set -eu
          version="${{ needs.detect-version.outputs.version }}"
          echo "Building @akua-dev/native@${version}"
          jq --arg v "$version" \
            '.version = $v | .dependencies["@akua-dev/native-engines"] = $v' \
            crates/akua-napi/package.json > crates/akua-napi/package.json.tmp
          mv crates/akua-napi/package.json.tmp crates/akua-napi/package.json

      # The git tag is the single source of truth for the version. Inject it
      # into the Rust workspace so CARGO_PKG_VERSION (SLSA provenance, OCI
      # annotations, user-agent) matches the tag the artifact ships under —
      # the committed Cargo.toml value is only a dev placeholder.
      - name: Set Cargo version from the tag
        shell: bash
        run: ./scripts/set-cargo-version.sh "${{ needs.detect-version.outputs.version }}"

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Download wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-bundle
          path: .

      - uses: mlugg/setup-zig@v2
        if: matrix.cross == true
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: matrix.cross == true
        with:
          tool: cargo-zigbuild

      - name: Build native (release)
        working-directory: crates/akua-napi
        shell: bash
        # `-x` tells napi to use cargo-zigbuild for cross-compile. zigbuild
        # knows how to set ARM ASM defines for ring and ships its own
        # musl toolchain — fixes both the napi-cross __ARM_ARCH failure
        # and the missing-musl-gcc problem in one step.
        run: |
          set -eu
          if [ "${{ matrix.cross }}" = "true" ]; then
            bunx napi build --platform --release --target ${{ matrix.target }} -x
          else
            bunx napi build --platform --release --target ${{ matrix.target }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: crates/akua-napi/*.node
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # trigger-publish — last step of release.yml. Dispatches
  # `release-publish.yml` with this run ID so it can consume the verified
  # native binaries, wasm engines, and staged SDK from Actions artifacts.
  # Recovery must never alter the immutable GitHub Release assets.
  #
  # Why split: npm publication has its own idempotency boundary, but every
  # recovery starts a fresh immutable source build so publish inputs never
  # depend on mutable Release assets. See release-publish.yml for the publish
  # logic itself.
  # ---------------------------------------------------------------------------
  trigger-publish:
    needs: [detect-version, wasm-bundle, native-build, sdk-build, github-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - name: Dispatch release-publish.yml
        # workflow_dispatch is explicitly carved out of the GITHUB_TOKEN
        # no-recursion rule (per Actions docs), so the default token
        # works — no PAT needed.
        env:
          TAG: ${{ needs.detect-version.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected-source-commit || needs.detect-version.outputs.source_commit }}
          EXPECTED_WORKFLOW_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected-workflow-commit || github.workflow_sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh workflow run release-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$WORKFLOW_REF" \
            -f tag="$TAG" \
            -f expected-source-commit="$EXPECTED_SOURCE_COMMIT" \
            -f expected-workflow-commit="$EXPECTED_WORKFLOW_COMMIT" \
            -f source-run-id="$GITHUB_RUN_ID"
          echo "Dispatched release-publish.yml with tag=$TAG source=$EXPECTED_SOURCE_COMMIT workflow=$EXPECTED_WORKFLOW_COMMIT. Watch:"
          echo "  https://github.com/$GITHUB_REPOSITORY/actions/workflows/release-publish.yml"

  # ---------------------------------------------------------------------------
  # sdk-build — regenerates types + schemas from the Rust source, runs
  # the drift guard, builds the SDK bundle. Independent of the native
  # publish chain (no native artefacts needed here — the SDK consumes
  # native at install time on end-user machines, not at build time).
  # ---------------------------------------------------------------------------
  sdk-build:
    needs: detect-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-release
          cache-on-failure: true

      - name: Regenerate SDK types + schema bundle
        run: mise exec -- task sdk:gen

      - name: Drift guard (fail if Rust source and bindings diverge)
        run: mise exec -- task sdk:check

      - name: Build SDK (bun bundle + tsc declarations)
        run: mise exec -- task sdk:build

      - name: Bump package.json version + native dep pin from the tag
        run: |
          set -eu
          version="${{ needs.detect-version.outputs.version }}"
          repo='git+https://github.com/akua-dev/akua.git'
          homepage='https://github.com/akua-dev/akua#readme'
          echo "Preparing @akua-dev/sdk@${version}"
          jq --arg v "$version" --arg repo "$repo" --arg homepage "$homepage" \
            '.version = $v
             | .dependencies["@akua-dev/native"] = $v
             | .repository.url = $repo
             | .homepage = $homepage' \
            packages/sdk/package.json > packages/sdk/package.json.tmp
          mv packages/sdk/package.json.tmp packages/sdk/package.json

      - name: Pack dry-run (manifest sanity)
        working-directory: packages/sdk
        run: npm pack --dry-run

      # Stage the prepared SDK tree (with bumped package.json + dist/)
      # for the publish job — same approach native uses to keep build
      # and publish on separate runners.
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-staged
          path: packages/sdk
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # cli-build — per-platform `akua` binary matrix. Downloads the wasm
  # bundle (same artefact native-build consumes), packages tarballs +
  # sha256 sidecars.
  # ---------------------------------------------------------------------------
  cli-build:
    needs: [detect-version, wasm-bundle]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # mold — dramatically faster link on Linux. No-op on macOS. Rust
      # 1.90 ships rust-lld as default on x86_64-linux-gnu (mold still
      # edges it); aarch64-linux-gnu still benefits substantially.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      # `~/.cargo/{registry,git}` + `target/` cache. Without this, every
      # tag push repaid the full cold-compile cost (~6 min each for
      # heavy git deps like kcl-lang). With it, warm runs collapse to
      # link-only time (~1-2 min). One cache per target so the 5 matrix
      # jobs don't stomp each other under the 10 GB per-repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Cross-compile for linux/arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - name: Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}

      # The git tag is the single source of truth for the version. Inject it
      # into the Rust workspace so the binary's CARGO_PKG_VERSION (akua -V,
      # SLSA provenance, OCI annotations, user-agent) matches the tag it
      # ships under — the committed Cargo.toml value is only a dev placeholder.
      - name: Set Cargo version from the tag
        shell: bash
        run: ./scripts/set-cargo-version.sh "${{ needs.detect-version.outputs.version }}"

      # Pull the wasm bundle the wasm-bundle job built. Bytes land at
      # their original paths under the workspace root — exactly where
      # akua-cli/build.rs + helm-engine-wasm/build.rs +
      # kustomize-engine-wasm/build.rs look for them. The matrix runner's
      # build.rs precompiles each .wasm into a target-arch cwasm via
      # wasmtime AOT.
      - name: Download wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-bundle
          path: .

      - name: Build akua CLI
        # `ci-release` profile: lto off, codegen-units=16, symbols
        # stripped, line-tables-only debug. Trades ~5-10% runtime perf
        # for ~25-40% compile-time reduction. See Cargo.toml.
        run: mise exec -- cargo build -p akua-cli --profile ci-release --target ${{ matrix.target }}

      # Smoke-test the binary the way an end-user would: `akua init` +
      # `akua render` against the scaffolded Package. Catches any future
      # "binary ships without a worker" / wrong-arch cwasm regression
      # before users see it. Skipped on cross-compiled targets where the
      # runner can't execute the output.
      - name: Smoke-test the built binary
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -eu
          bin="$PWD/target/${{ matrix.target }}/ci-release/akua"
          # Guard: the binary must report the tag it ships under. Catches a
          # regression in the version-injection step before users see a
          # release whose `akua -V` disagrees with its tag.
          expected="${{ needs.detect-version.outputs.version }}"
          got="$("$bin" -V | awk '{print $NF}')"
          if [ "$got" != "$expected" ]; then
            echo "version mismatch: binary reports '$got', tag is '$expected'" >&2
            exit 1
          fi
          echo "version ok: akua -V == $expected"
          tmp=$(mktemp -d)
          cd "$tmp"
          "$bin" init smoke
          cd smoke
          "$bin" render
          test -d ./deploy
          test -n "$(ls ./deploy)"
          echo "smoke ok: $(ls ./deploy)"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="akua-${{ needs.detect-version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/ci-release/akua dist/
          cp README.md SECURITY.md LICENSE dist/ 2>/dev/null || true
          cd dist && tar -czf "${name}.tar.gz" akua README.md SECURITY.md LICENSE
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "akua-${{ needs.detect-version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/ci-release/akua.exe" -Destination dist/
          Copy-Item README.md,SECURITY.md,LICENSE -Destination dist/ -ErrorAction SilentlyContinue
          Push-Location dist
          7z a "$name.zip" akua.exe README.md SECURITY.md LICENSE
          (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: akua-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  # ---------------------------------------------------------------------------
  # github-release — uploads the per-target tarballs as Release assets.
  # Marks the Release as prerelease for `v*-rc*` tags so the GitHub UI
  # surfaces "Pre-release" badge + `gh release view --latest` skips it.
  # ---------------------------------------------------------------------------
  github-release:
    needs: [detect-version, cli-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}
      - uses: actions/download-artifact@v8
        with:
          # Filter to the cli-build artifacts this job consumes —
          # `akua-<target>` per-platform tarballs + sha256 sidecars
          # (uploaded as `name: akua-${{ matrix.target }}` upstream).
          # Without the pattern, download-artifact also pulls the
          # docker job's `akua-dev~akua~<id>.dockerbuild` provenance
          # artifact whose `~`-containing name fails path validation
          # in v4 (and only silently slips by on v8 because the
          # merge-multiple flag tolerates it; defensive here so a
          # v8 → v4 downgrade doesn't bring back the bug).
          pattern: 'akua-*'
          path: dist
          merge-multiple: true
      - name: Create or verify immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          SOURCE_COMMIT: ${{ needs.detect-version.outputs.source_commit }}
          IS_PRERELEASE: ${{ needs.detect-version.outputs.is_prerelease }}
        run: |
          set -eu
          notes="See [CHANGELOG.md](https://github.com/akua-dev/akua/blob/main/CHANGELOG.md) for details."
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release view "${TAG}" --repo "${GH_REPO}" > /dev/null
            echo "Verified existing immutable Release ${TAG}; recovery does not upload or replace assets."
            exit 0
          fi
          flags=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --verify-tag \
            --target "${SOURCE_COMMIT}" \
            --title "akua ${VERSION}" \
            --notes "${notes}" \
            "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/*.sha256

  # ---------------------------------------------------------------------------
  # docker — multi-arch image at `ghcr.io/akua-dev/akua:<tag>`. Skips
  # the `:latest` tag for prereleases so `docker pull akua:latest`
  # stays on the most recent stable release.
  # ---------------------------------------------------------------------------
  docker:
    needs: [detect-version, cli-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: 'akua-*'
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Linux binaries for the image
        # Pull the prebuilt binaries out of the release tarballs we just
        # built — avoids a separate compile-in-Docker step and keeps the
        # image contents byte-identical to the GitHub Release.
        run: |
          set -eu
          mkdir -p image-context/amd64 image-context/arm64
          tag="${{ needs.detect-version.outputs.tag }}"
          tar -xzf "dist/akua-${tag}-x86_64-unknown-linux-gnu.tar.gz" -C image-context/amd64 akua
          tar -xzf "dist/akua-${tag}-aarch64-unknown-linux-gnu.tar.gz" -C image-context/arm64 akua
      - name: Compute image tags
        id: tags
        run: |
          set -eu
          tag="${{ needs.detect-version.outputs.tag }}"
          # Versioned tag always; `:latest` only for stable releases.
          tags="ghcr.io/akua-dev/akua:${tag}"
          if [ "${{ needs.detect-version.outputs.is_prerelease }}" = "false" ]; then
            tags="${tags}
          ghcr.io/akua-dev/akua:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build + push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: image-context
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

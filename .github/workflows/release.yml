name: release

# Single unified release pipeline. Triggered by `v<semver>` tag pushes.
# Replaces the three previous workflows (native-release / sdk-release /
# cli-release) and the runtime-coupling-via-npm-poll between them.
#
# Job graph:
#
#   detect-version ─┬─> wasm-bundle ─┬─> native-build ──> native-publish ─┐
#                   │                │                                    ├─> sdk-publish
#                   │                │                  sdk-build ────────┘
#                   │                │
#                   │                └─> cli-build ─┬──> github-release ──> homebrew-tap
#                   │                               └──> docker
#                   └─ (version + is_prerelease propagated to every job)
#
# Key wins over the previous three-workflow setup:
# - No npm polling. `sdk-publish` has `needs: native-publish` and runs
#   the millisecond native finishes (was a 30-s-resolution / 45-min-
#   timeout poll loop in sdk-release.yml).
# - `wasm-bundle` builds once. native-release rebuilt the engine wasm
#   inside its matrix; cli-release rebuilt it again. ~5–10 min saved.
# - One status check per release run instead of three independent ones.
#
# Prerelease handling: tags containing `-` (e.g. `v0.8.7-rc1`) publish
# to the npm `next` dist-tag instead of `latest`, are marked as
# prereleases on GitHub Releases, skip `:latest` Docker tag, and skip
# the Homebrew tap bump entirely. Stable tags get the full surface.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Skip every actual publish; build + pack only'
        type: boolean
        default: true
      tag:
        description: 'Tag name (e.g. v0.8.7) — required for manual runs'
        required: true

permissions:
  contents: write   # github-release: create Releases
  packages: write   # docker: push to ghcr.io
  id-token: write   # npm publish: OIDC trusted publishing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # detect-version — single source of truth for tag-derived strings.
  # Other jobs reference these outputs instead of re-parsing GITHUB_REF_NAME,
  # which avoids tag-prefix drift and keeps prerelease detection in one
  # place (the only spot a typo here would surface).
  # ---------------------------------------------------------------------------
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.parse.outputs.npm_dist_tag }}
    steps:
      - id: parse
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # Semver prerelease has a `-` separator after the patch number
          # (1.2.3-rc1, 1.2.3-alpha.4). A bare `v1.2.3` doesn't match.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            npm_dist_tag=next
          else
            is_prerelease=false
            npm_dist_tag=latest
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "npm_dist_tag=$npm_dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag version=$version prerelease=$is_prerelease npm_dist_tag=$npm_dist_tag"

  # ---------------------------------------------------------------------------
  # wasm-bundle — engine + render-worker wasm artefacts built once on
  # Linux. wasm32-wasip1 is byte-deterministic across runners, so the
  # native + cli matrix jobs each download the same bytes instead of
  # rebuilding them — saves ~5-10 min per matrix runner and unblocks
  # the Windows runner (the helm fork's apply.sh is bash, can't run on
  # Windows natively).
  # ---------------------------------------------------------------------------
  wasm-bundle:
    runs-on: ubuntu-latest
    needs: detect-version
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: rui314/setup-mold@v1

      - name: Install wasm32-wasip1 target
        run: mise exec -- rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-bundle
          cache-on-failure: true

      # Mirror the cache shape ci.yml uses — same content-addressed
      # keys mean this job inherits hits from main-branch CI runs and
      # skips redundant Go compiles.
      - name: Restore helm engine wasm cache
        uses: actions/cache@v5
        with:
          path: crates/helm-engine-wasm/assets/helm-engine.wasm
          key: helm-engine-${{ runner.os }}-${{ hashFiles('.mise.toml', 'crates/helm-engine-wasm/go-src/**', 'crates/helm-engine-wasm/fork/**') }}

      - name: Restore kustomize engine wasm cache
        uses: actions/cache@v5
        with:
          path: crates/kustomize-engine-wasm/assets/kustomize-engine.wasm
          key: kustomize-engine-${{ runner.os }}-${{ hashFiles('.mise.toml', 'crates/kustomize-engine-wasm/go-src/**') }}

      - name: Cache Go module + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('.mise.toml', '**/go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache helm fork tree
        uses: actions/cache@v5
        with:
          path: crates/helm-engine-wasm/third_party/helm-fork
          key: helm-fork-${{ runner.os }}-${{ hashFiles('crates/helm-engine-wasm/fork/**') }}

      - name: Build embedded engines (Go → wasip1)
        run: mise exec -- task build:engines

      - name: Build embedded render-worker (Rust → wasip1)
        run: mise exec -- task build:render-worker

      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: |
            crates/helm-engine-wasm/assets/helm-engine.wasm
            crates/kustomize-engine-wasm/assets/kustomize-engine.wasm
            target/wasm32-wasip1/release/akua-render-worker.wasm
            target/wasm32-wasip1/release/akua-render-worker.wasm.sources.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # native-build — per-platform `.node` binary matrix. Downloads the
  # wasm bundle, runs `napi build` against the local toolchain.
  # ---------------------------------------------------------------------------
  native-build:
    needs: [detect-version, wasm-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          # macos-13 (Intel) runners are being deprecated and queue for
          # 40min+. Cross-compile x86_64 from macos-14 (arm64) — rustc
          # + Apple SDK handle this without extra setup.
          - host: macos-14
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pin to the same rust version mise installs (`.mise.toml`) so the
      # cross-compile target lands on the toolchain mise will later
      # activate. With `@stable`, mise's rust 1.95.0 became the active
      # toolchain after this step ran and cargo couldn't find the target.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.target }}
          cache-on-failure: true

      - name: Bump package.json version from the tag
        shell: bash
        run: |
          set -eu
          version="${{ needs.detect-version.outputs.version }}"
          echo "Building @akua-dev/native@${version}"
          jq --arg v "$version" '.version = $v' \
            crates/akua-napi/package.json > crates/akua-napi/package.json.tmp
          mv crates/akua-napi/package.json.tmp crates/akua-napi/package.json

      - uses: oven-sh/setup-bun@v2

      - name: Install napi deps
        working-directory: crates/akua-napi
        run: bun install --frozen-lockfile

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Download wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-bundle
          path: .

      - uses: mlugg/setup-zig@v2
        if: matrix.cross == true
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: matrix.cross == true
        with:
          tool: cargo-zigbuild

      - name: Build native (release)
        working-directory: crates/akua-napi
        shell: bash
        # `-x` tells napi to use cargo-zigbuild for cross-compile. zigbuild
        # knows how to set ARM ASM defines for ring and ships its own
        # musl toolchain — fixes both the napi-cross __ARM_ARCH failure
        # and the missing-musl-gcc problem in one step.
        run: |
          set -eu
          if [ "${{ matrix.cross }}" = "true" ]; then
            bunx napi build --platform --release --target ${{ matrix.target }} -x
          else
            bunx napi build --platform --release --target ${{ matrix.target }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: crates/akua-napi/*.node
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # native-publish — stages npm packages from the matrix artefacts +
  # the wasm bundle, publishes via OIDC trusted publishing.
  # ---------------------------------------------------------------------------
  native-publish:
    needs: [detect-version, wasm-bundle, native-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        # Node 24 ships npm 11.x which has OIDC trusted-publishing
        # support. Node 22 ships npm 10.x (no trust support) and
        # `npm install -g npm@latest` from there hits a known
        # promise-retry self-upgrade bug. setup-node's `registry-url`
        # is omitted on purpose: it writes a `.npmrc` containing a
        # literal placeholder `_authToken=${NODE_AUTH_TOKEN}` that
        # intercepts OIDC.
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: Bump package.json version from the tag
        run: |
          set -eu
          version="${{ needs.detect-version.outputs.version }}"
          jq --arg v "$version" '.version = $v' \
            crates/akua-napi/package.json > crates/akua-napi/package.json.tmp
          mv crates/akua-napi/package.json.tmp crates/akua-napi/package.json

      - name: Install napi deps
        working-directory: crates/akua-napi
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          path: crates/akua-napi/artifacts

      - name: Generate per-platform npm dirs
        working-directory: crates/akua-napi
        run: bunx napi create-npm-dirs

      - name: Move artifacts into the per-platform npm dirs
        working-directory: crates/akua-napi
        run: bunx napi artifacts

      - name: List staged packages
        working-directory: crates/akua-napi
        run: ls -R npm

      - name: Stage engines into the npm package dir
        # Bump version + copy the wasm bytes (downloaded above as the
        # `wasm-bundle` artefact) into the engines package source layout
        # so `npm publish` finds them.
        run: |
          set -eu
          version="${{ needs.detect-version.outputs.version }}"
          cp crates/akua-napi/artifacts/wasm-bundle/helm-engine-wasm/assets/helm-engine.wasm \
             crates/akua-native-engines-npm/helm-engine.wasm
          cp crates/akua-napi/artifacts/wasm-bundle/kustomize-engine-wasm/assets/kustomize-engine.wasm \
             crates/akua-native-engines-npm/kustomize-engine.wasm
          jq --arg v "$version" '.version = $v' \
            crates/akua-native-engines-npm/package.json \
            > crates/akua-native-engines-npm/package.json.tmp
          mv crates/akua-native-engines-npm/package.json.tmp \
             crates/akua-native-engines-npm/package.json

      - name: Publish all packages
        # Auth via npm trusted publishing (OIDC). Order is load-bearing:
        # engines first, then per-platform `.node` packages, then the
        # meta `@akua-dev/native` (which declares optionalDependencies
        # on the per-platform packages + a regular dep on engines).
        #
        # Idempotency: probes `npm view <pkg>@<v>` and skips already-
        # published packages. A recovery rerun from a previous partial
        # publish (network blip, OIDC hiccup mid-loop) finishes the
        # remaining packages without manual surgery.
        if: github.event_name == 'push' || inputs.dry-run == false
        env:
          NPM_DIST_TAG: ${{ needs.detect-version.outputs.npm_dist_tag }}
        run: |
          set -eu

          publish_one() {
            local dir="$1" name version
            name=$(jq -r '.name'    "$dir/package.json")
            version=$(jq -r '.version' "$dir/package.json")
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "Skipping ${name}@${version} — already on npm"
              return 0
            fi
            (cd "$dir" && npm publish --access public --provenance --tag "$NPM_DIST_TAG")
          }

          echo "Publishing under dist-tag: $NPM_DIST_TAG"
          echo "Publishing @akua-dev/native-engines"
          publish_one crates/akua-native-engines-npm
          for dir in crates/akua-napi/npm/*/; do
            echo "Publishing ${dir}"
            publish_one "${dir%/}"
          done
          echo "Publishing meta @akua-dev/native"
          publish_one crates/akua-napi

      - name: Pack only (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          set -eu
          (cd crates/akua-native-engines-npm && npm pack --dry-run)
          for dir in crates/akua-napi/npm/*/; do
            (cd "$dir" && npm pack --dry-run)
          done
          (cd crates/akua-napi && npm pack --dry-run)

  # ---------------------------------------------------------------------------
  # sdk-build — regenerates types + schemas from the Rust source, runs
  # the drift guard, builds the SDK bundle. Independent of the native
  # publish chain (no native artefacts needed here — the SDK consumes
  # native at install time on end-user machines, not at build time).
  # ---------------------------------------------------------------------------
  sdk-build:
    needs: detect-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-release
          cache-on-failure: true

      - name: Regenerate SDK types + schema bundle
        run: mise exec -- task sdk:gen

      - name: Drift guard (fail if Rust source and bindings diverge)
        run: mise exec -- task sdk:check

      - name: Bump package.json version + native dep pin from the tag
        run: |
          set -eu
          version="${{ needs.detect-version.outputs.version }}"
          echo "Preparing @akua-dev/sdk@${version}"
          jq --arg v "$version" \
            '.version = $v | .dependencies["@akua-dev/native"] = $v' \
            packages/sdk/package.json > packages/sdk/package.json.tmp
          mv packages/sdk/package.json.tmp packages/sdk/package.json

      - name: Build SDK (bun bundle + tsc declarations)
        run: mise exec -- task sdk:build

      - name: Pack dry-run (manifest sanity)
        working-directory: packages/sdk
        run: npm pack --dry-run

      # Stage the prepared SDK tree (with bumped package.json + dist/)
      # for the publish job — same approach native uses to keep build
      # and publish on separate runners.
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-staged
          path: packages/sdk
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # sdk-publish — depends on BOTH `sdk-build` AND `native-publish`.
  # The `needs:` edge to native-publish replaces the 45-min npm-poll
  # loop that the previous sdk-release.yml used. Instant sync, no
  # stale-failure timeout masking real errors.
  # ---------------------------------------------------------------------------
  sdk-publish:
    needs: [detect-version, sdk-build, native-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: sdk-staged
          path: sdk

      - name: Pack dry-run (manifest sanity, post-staging)
        working-directory: sdk
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry-run == false
        working-directory: sdk
        env:
          NPM_DIST_TAG: ${{ needs.detect-version.outputs.npm_dist_tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"

  # ---------------------------------------------------------------------------
  # cli-build — per-platform `akua` binary matrix. Downloads the wasm
  # bundle (same artefact native-build consumes), packages tarballs +
  # sha256 sidecars.
  # ---------------------------------------------------------------------------
  cli-build:
    needs: [detect-version, wasm-bundle]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # mold — dramatically faster link on Linux. No-op on macOS. Rust
      # 1.90 ships rust-lld as default on x86_64-linux-gnu (mold still
      # edges it); aarch64-linux-gnu still benefits substantially.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      # `~/.cargo/{registry,git}` + `target/` cache. Without this, every
      # tag push repaid the full cold-compile cost (~6 min each for
      # heavy git deps like kcl-lang). With it, warm runs collapse to
      # link-only time (~1-2 min). One cache per target so the 5 matrix
      # jobs don't stomp each other under the 10 GB per-repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Cross-compile for linux/arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - name: Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}

      # Pull the wasm bundle the wasm-bundle job built. Bytes land at
      # their original paths under the workspace root — exactly where
      # akua-cli/build.rs + helm-engine-wasm/build.rs +
      # kustomize-engine-wasm/build.rs look for them. The matrix runner's
      # build.rs precompiles each .wasm into a target-arch cwasm via
      # wasmtime AOT.
      - name: Download wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-bundle
          path: .

      - name: Build akua CLI
        # `ci-release` profile: lto off, codegen-units=16, symbols
        # stripped, line-tables-only debug. Trades ~5-10% runtime perf
        # for ~25-40% compile-time reduction. See Cargo.toml.
        run: mise exec -- cargo build -p akua-cli --profile ci-release --target ${{ matrix.target }}

      # Smoke-test the binary the way an end-user would: `akua init` +
      # `akua render` against the scaffolded Package. Catches any future
      # "binary ships without a worker" / wrong-arch cwasm regression
      # before users see it. Skipped on cross-compiled targets where the
      # runner can't execute the output.
      - name: Smoke-test the built binary
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -eu
          bin="$PWD/target/${{ matrix.target }}/ci-release/akua"
          tmp=$(mktemp -d)
          cd "$tmp"
          "$bin" init smoke
          cd smoke
          "$bin" render
          test -d ./deploy
          test -n "$(ls ./deploy)"
          echo "smoke ok: $(ls ./deploy)"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="akua-${{ needs.detect-version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/ci-release/akua dist/
          cp README.md SECURITY.md LICENSE dist/ 2>/dev/null || true
          cd dist && tar -czf "${name}.tar.gz" akua README.md SECURITY.md LICENSE
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "akua-${{ needs.detect-version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/ci-release/akua.exe" -Destination dist/
          Copy-Item README.md,SECURITY.md,LICENSE -Destination dist/ -ErrorAction SilentlyContinue
          Push-Location dist
          7z a "$name.zip" akua.exe README.md SECURITY.md LICENSE
          (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: akua-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  # ---------------------------------------------------------------------------
  # github-release — uploads the per-target tarballs as Release assets.
  # Marks the Release as prerelease for `v*-rc*` tags so the GitHub UI
  # surfaces "Pre-release" badge + `gh release view --latest` skips it.
  # ---------------------------------------------------------------------------
  github-release:
    needs: [detect-version, cli-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          flags=()
          if [ "${{ needs.detect-version.outputs.is_prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ needs.detect-version.outputs.tag }}" \
            --title "akua ${{ needs.detect-version.outputs.version }}" \
            --notes "See [CHANGELOG.md](https://github.com/cnap-tech/akua/blob/main/CHANGELOG.md) for details." \
            "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/*.sha256

  # ---------------------------------------------------------------------------
  # docker — multi-arch image at `ghcr.io/cnap-tech/akua:<tag>`. Skips
  # the `:latest` tag for prereleases so `docker pull akua:latest`
  # stays on the most recent stable release.
  # ---------------------------------------------------------------------------
  docker:
    needs: [detect-version, cli-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Linux binaries for the image
        # Pull the prebuilt binaries out of the release tarballs we just
        # built — avoids a separate compile-in-Docker step and keeps the
        # image contents byte-identical to the GitHub Release.
        run: |
          set -eu
          mkdir -p image-context/amd64 image-context/arm64
          tag="${{ needs.detect-version.outputs.tag }}"
          tar -xzf "dist/akua-${tag}-x86_64-unknown-linux-gnu.tar.gz" -C image-context/amd64 akua
          tar -xzf "dist/akua-${tag}-aarch64-unknown-linux-gnu.tar.gz" -C image-context/arm64 akua
      - name: Compute image tags
        id: tags
        run: |
          set -eu
          tag="${{ needs.detect-version.outputs.tag }}"
          # Versioned tag always; `:latest` only for stable releases.
          tags="ghcr.io/cnap-tech/akua:${tag}"
          if [ "${{ needs.detect-version.outputs.is_prerelease }}" = "false" ]; then
            tags="${tags}
          ghcr.io/cnap-tech/akua:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build + push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: image-context
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  # ---------------------------------------------------------------------------
  # homebrew-tap — auto-bump cnap-tech/homebrew-tap's `Formula/akua.rb`.
  # Skipped for prereleases (regular `brew install akua` users
  # shouldn't get RC builds — they have to opt in via
  # `brew install --HEAD akua` or pin a specific version).
  # ---------------------------------------------------------------------------
  homebrew-tap:
    needs: [detect-version, github-release]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' || inputs.dry-run == false) &&
      needs.detect-version.outputs.is_prerelease == 'false'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Configure SSH for the tap repo
        env:
          TAP_BUMP_SSH_KEY: ${{ secrets.TAP_BUMP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TAP_BUMP_SSH_KEY" > ~/.ssh/tap_bump_key
          chmod 600 ~/.ssh/tap_bump_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com-tap
            HostName github.com
            User git
            IdentityFile ~/.ssh/tap_bump_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Clone tap, rewrite formula, push
        env:
          TAG: ${{ needs.detect-version.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -eu

          # Read each target's sha256 from the per-asset .sha256 file.
          get_sha() {
            awk '{print $1}' "dist/akua-${TAG}-$1.tar.gz.sha256"
          }
          darwin_arm_sha=$(get_sha aarch64-apple-darwin)
          darwin_x86_sha=$(get_sha x86_64-apple-darwin)
          linux_arm_sha=$(get_sha aarch64-unknown-linux-gnu)
          linux_x86_sha=$(get_sha x86_64-unknown-linux-gnu)

          git clone git@github.com-tap:cnap-tech/homebrew-tap.git tap
          cd tap
          git config user.email "akua-tap-bumper@cnap-tech"
          git config user.name  "akua-tap-bumper"

          # Rewrite the whole formula. Simpler than four sed passes,
          # and the formula shape is our own — no surprise stanzas
          # another maintainer might have added mid-file.
          cat > Formula/akua.rb <<RUBY
          # frozen_string_literal: true

          # Auto-bumped by release.yml in cnap-tech/akua on every stable
          # tag push. Manual edits get overwritten.
          class Akua < Formula
            desc "Cloud-native package build, transform, and preview toolkit"
            homepage "https://github.com/cnap-tech/akua"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/cnap-tech/akua/releases/download/v#{version}/akua-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${darwin_arm_sha}"
              end
              on_intel do
                url "https://github.com/cnap-tech/akua/releases/download/v#{version}/akua-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${darwin_x86_sha}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/cnap-tech/akua/releases/download/v#{version}/akua-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_arm_sha}"
              end
              on_intel do
                url "https://github.com/cnap-tech/akua/releases/download/v#{version}/akua-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_x86_sha}"
              end
            end

            def install
              bin.install "akua"
              doc.install "README.md", "SECURITY.md" if File.exist?("README.md")
            end

            test do
              assert_match(/akua/, shell_output("#{bin}/akua --version"))
            end
          end
          RUBY

          git add Formula/akua.rb
          if git diff --cached --quiet; then
            echo "formula already at ${VERSION}, nothing to bump"
            exit 0
          fi
          git commit -m "akua ${TAG}

          Released in https://github.com/cnap-tech/akua/releases/tag/${TAG}"
          git push
